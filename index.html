<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калька — рисуй по фото через камеру</title>
<style>
:root{--bg:#14161a;--panel:rgba(20,22,26,.86);--ink:#f2f0ea;--mute:#9a9d a4;--line:#34383f;--acc:#6ea8ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;background:#000;touch-action:none;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ov{position:absolute;left:50%;top:50%;max-width:80vw;max-height:60vh;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none;will-change:transform}
#panel{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
.row{display:flex;align-items:center;gap:12px}
.lbl{font-size:14px;min-width:3.2em;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;height:36px;accent-color:var(--acc);margin:0}
.btns{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.btns::-webkit-scrollbar{display:none}
button,.fbtn{flex:0 0 auto;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#1d2025;color:var(--ink);font:inherit;font-size:14px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button:focus-visible,.fbtn:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);border-color:var(--acc);color:#0b1220}
button:active{transform:scale(.97)}
#start{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:28px;padding-top:calc(28px + env(safe-area-inset-top,0px))}
#start h1{font-size:44px;line-height:1.02;margin:0 0 14px;letter-spacing:-.02em;font-weight:800}
#start p{margin:0 0 28px;color:#b4b7bd;max-width:30em}
.big{min-height:56px;font-size:17px;font-weight:600;background:var(--acc);border-color:var(--acc);color:#0b1220;width:100%;max-width:420px;border-radius:14px}
#err{margin-top:16px;color:#ffb4a8;font-size:14px;max-width:30em}
.hint{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;z-index:4;transition:opacity .6s;pointer-events:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="start">
  <h1>Калька</h1>
  <p>Выберите фото — оно ляжет полупрозрачным слоем поверх камеры. Положите лист бумаги под телефон и обводите.</p>
  <label class="fbtn big" style="cursor:pointer">Выбрать фото<input id="file" type="file" accept="image/*" hidden></label>
  <div id="err" hidden></div>
</div>

<div id="stage" hidden>
  <video id="cam" autoplay playsinline muted></video>
  <img id="ov" alt="Фото для обводки">
  <div class="hint" id="hint">Двигайте пальцем, двумя пальцами — масштаб и поворот</div>
</div>

<div id="panel" hidden>
  <div class="row">
    <span class="lbl">Фото</span>
    <input id="op" type="range" min="0" max="100" value="50" aria-label="Прозрачность фото">
    <span class="lbl" id="pv">50%</span>
  </div>
  <div class="btns">
    <label class="fbtn">Другое фото<input id="file2" type="file" accept="image/*" hidden></label>
    <button id="flip">Камера</button>
    <button id="mir">Отзеркалить</button>
    <button id="grey">Ч/Б</button>
    <button id="lock">Закрепить</button>
    <button id="hide">Скрыть фото</button>
    <button id="reset">Сбросить</button>
    <button id="ui">Скрыть панель</button>
  </div>
</div>
<button id="showui" hidden style="position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--panel)">Панель</button>

<script>
const $=id=>document.getElementById(id);
const ov=$('ov'),cam=$('cam'),stage=$('stage'),panel=$('panel');
let st={x:0,y:0,s:1,r:0,mx:1},locked=false,facing='environment',stream=null,wl=null;

function apply(){ov.style.transform=`translate(-50%,-50%) translate(${st.x}px,${st.y}px) rotate(${st.r}rad) scale(${st.s*st.mx},${st.s})`}

function loadImg(f){
  if(!f)return;
  const url=URL.createObjectURL(f);
  ov.onload=()=>{st={x:0,y:0,s:1,r:0,mx:1};apply();};
  ov.src=url;
  $('start').hidden=true;stage.hidden=false;panel.hidden=false;
  startCam();
  setTimeout(()=>{$('hint').style.opacity=0},4500);
}
$('file').onchange=e=>loadImg(e.target.files[0]);
$('file2').onchange=e=>{const f=e.target.files[0];if(f){ov.src=URL.createObjectURL(f);st={x:0,y:0,s:1,r:0,mx:1};apply()}};

async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    cam.srcObject=stream;
    cam.style.transform=facing==='user'?'scaleX(-1)':'none';
    try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  }catch(e){
    showErr(e);
  }
}
function showErr(e){
  $('start').hidden=false;stage.hidden=true;panel.hidden=true;
  const m=$('err');m.hidden=false;
  const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
  m.textContent=denied
    ?'Нет доступа к камере. Разрешите камеру в настройках браузера. Если страница открыта внутри приложения, откройте ссылку в Safari или Chrome.'
    :'Не удалось включить камеру ('+(e&&e.name||'ошибка')+'). Проверьте, что она не занята другим приложением.';
}
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&stream){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}});

$('op').oninput=e=>{ov.style.opacity=e.target.value/100;$('pv').textContent=e.target.value+'%'};
ov.style.opacity=.5;

function tog(id,fn){const b=$(id);b.onclick=()=>{const on=b.classList.toggle('on');fn(on)}}
tog('mir',on=>{st.mx=on?-1:1;apply()});
tog('grey',on=>{ov.style.filter=on?'grayscale(1) contrast(1.2)':'none'});
tog('lock',on=>{locked=on;$('lock').textContent=on?'Закреплено':'Закрепить'});
tog('hide',on=>{ov.style.visibility=on?'hidden':'visible';$('hide').textContent=on?'Показать фото':'Скрыть фото'});
$('reset').onclick=()=>{st={x:0,y:0,s:1,r:0,mx:st.mx};apply()};
$('ui').onclick=()=>{panel.hidden=true;$('showui').hidden=false};
$('showui').onclick=()=>{panel.hidden=false;$('showui').hidden=true};

/* жесты: 1 палец — перемещение, 2 пальца — масштаб и поворот */
const P=new Map();
const info=()=>{const [a,b]=[...P.values()];return{d:Math.hypot(b.x-a.x,b.y-a.y),a:Math.atan2(b.y-a.y,b.x-a.x),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}};
stage.addEventListener('pointerdown',e=>{if(locked)return;stage.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY})});
stage.addEventListener('pointermove',e=>{
  if(locked||!P.has(e.pointerId))return;
  if(P.size===1){
    const p=P.get(e.pointerId);st.x+=e.clientX-p.x;st.y+=e.clientY-p.y;
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  }else if(P.size===2){
    const o=info();P.set(e.pointerId,{x:e.clientX,y:e.clientY});const n=info();
    if(o.d>0)st.s=Math.min(8,Math.max(.1,st.s*n.d/o.d));
    st.r+=(n.a-o.a)*st.mx;
    st.x+=n.cx-o.cx;st.y+=n.cy-o.cy;
  }
  apply();
});
const up=e=>P.delete(e.pointerId);
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{if(locked)return;e.preventDefault();st.s=Math.min(8,Math.max(.1,st.s*(e.deltaY<0?1.06:.94)));apply()},{passive:false});
</script>
</body>
</html>
